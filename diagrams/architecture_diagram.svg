<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="950" height="620" fill="#f8fafc" rx="12" />
  
  <!-- Header -->
  <rect x="25" y="20" width="900" height="60" rx="8" fill="url(#grad1)" filter="url(#shadow)" />
  <text x="50" y="56" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">ResumeForge: System Architecture Overview</text>
  <text x="650" y="55" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">CSE (Data Science) Project</text>

  <!-- Layer 1: Presentation -->
  <rect x="40" y="105" width="870" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="105" width="220" height="28" rx="4" fill="#3b82f6" />
  <text x="50" y="124" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">1. PRESENTATION / CLIENT LAYER</text>
  <text x="60" y="160" fill="#1e293b" font-family="sans-serif" font-size="13">Responsive Web UI (Tailwind CSS, HTML5, Vanilla JS)</text>
  <text x="430" y="160" fill="#475569" font-family="sans-serif" font-size="13">Resume &amp; JD Ingestion Portal</text>
  <text x="680" y="160" fill="#475569" font-family="sans-serif" font-size="13">Interactive Diff &amp; Score Dashboard</text>

  <!-- Arrow -->
  <line x1="475" y1="190" x2="475" y2="215" stroke="#6366f1" stroke-width="3" stroke-dasharray="4"/>

  <!-- Layer 2: API Gateway -->
  <rect x="40" y="215" width="870" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="215" width="220" height="28" rx="4" fill="#6366f1" />
  <text x="50" y="234" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">2. API &amp; ROUTING GATEWAY</text>
  <text x="60" y="265" fill="#1e293b" font-family="sans-serif" font-size="13">FastAPI / Flask REST Endpoints</text>
  <text x="350" y="265" fill="#475569" font-family="sans-serif" font-size="13">JWT Authentication &amp; Rate Limiter</text>
  <text x="660" y="265" fill="#475569" font-family="sans-serif" font-size="13">File Validation &amp; Payload Sanitizer</text>

  <!-- Arrow -->
  <line x1="475" y1="290" x2="475" y2="315" stroke="#6366f1" stroke-width="3" stroke-dasharray="4"/>

  <!-- Layer 3: Core AI Processing -->
  <rect x="40" y="315" width="870" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="315" width="220" height="28" rx="4" fill="#8b5cf6" />
  <text x="50" y="334" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">3. CORE AI &amp; ANALYTICS ENGINE</text>
  
  <rect x="60" y="355" width="180" height="55" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="75" y="377" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">Parsing Engine</text>
  <text x="75" y="396" fill="#64748b" font-family="sans-serif" font-size="11">pdfplumber &amp; PyPDF2</text>

  <rect x="270" y="355" width="190" height="55" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="285" y="377" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">Semantic Matcher</text>
  <text x="285" y="396" fill="#64748b" font-family="sans-serif" font-size="11">Sentence-Transformers</text>

  <rect x="490" y="355" width="190" height="55" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="505" y="377" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">RAG Orchestrator</text>
  <text x="505" y="396" fill="#64748b" font-family="sans-serif" font-size="11">LangChain Retrieval</text>

  <rect x="710" y="355" width="180" height="55" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="725" y="377" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">GenAI Engine</text>
  <text x="725" y="396" fill="#64748b" font-family="sans-serif" font-size="11">STAR Bullet Tailoring</text>

  <!-- Arrow -->
  <line x1="475" y1="425" x2="475" y2="450" stroke="#6366f1" stroke-width="3" stroke-dasharray="4"/>

  <!-- Layer 4: Data & Persistence -->
  <rect x="40" y="450" width="870" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="450" width="220" height="28" rx="4" fill="#0ea5e9" />
  <text x="50" y="469" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">4. DATA &amp; STORAGE LAYER</text>
  <text x="60" y="502" fill="#1e293b" font-family="sans-serif" font-size="13">PostgreSQL / MongoDB (User Profiles, Resumes)</text>
  <text x="460" y="502" fill="#475569" font-family="sans-serif" font-size="13">Vector DB (FAISS / ChromaDB for Embeddings)</text>
  <text x="790" y="502" fill="#475569" font-family="sans-serif" font-size="13">S3 Storage</text>

  <!-- Footer Team -->
  <rect x="40" y="545" width="870" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="575" fill="#64748b" font-family="sans-serif" font-size="12">Team: Syed Mustafa Uddin | Afraz Ullah Khan | Syed Asharibuddin Hasan  •  Supervised by: Mohammed Zama Uddin Atif  •  Manac Infotech Pvt. Ltd.</text>
</svg>
